<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>3C工芸 NC加工から組立まで（3D）</title>
<!-- © 2026 MR Design · 会社紹介スライド「NC加工から組立まで」。index.html の iframe から postMessage('play'|'pause') で動く -->
<style>
:root{--bg:#0c0a16;--card:#181230;--line:#2d2450;--fg:#f3effb;--mut:#aaa0c8;--dim:#6f6694;--gold:#b078ff;--gold2:#d6c3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#d6d0c6;touch-action:none}
#stage canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{font:600 11px "Hiragino Sans",sans-serif;color:#2f3a44;background:rgba(255,252,246,.88);border:1px solid #fff;border-radius:999px;padding:3px 8px;box-shadow:0 2px 8px rgba(60,50,40,.18);white-space:nowrap}
.lbl small{font-weight:500;color:rgba(47,58,68,.62);margin-left:3px}
#tag{position:absolute;left:10px;top:10px;font-size:11px;color:var(--fg);background:rgba(12,10,22,.62);padding:4px 10px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:none}
#tag b{color:var(--gold2);font-weight:700;margin-right:5px}
#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#dock{flex:none;padding:10px 12px 10px;background:var(--card);border-top:1px solid var(--line)}
#caphead{display:flex;align-items:baseline;gap:8px}
#stepNo{font-size:11px;font-weight:700;color:#140c28;background:var(--gold);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
#stepName{font-size:14.5px;font-weight:700}
#meta{margin-left:auto;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
#capText{margin:4px 0 6px;font-size:12.5px;line-height:1.55;color:var(--mut);min-height:1.55em}
#ctl{display:flex;align-items:center;gap:6px}
#ctl button{appearance:none;flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(24,18,48,.9);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
#ctl button.primary{background:var(--gold);border-color:var(--gold);color:#140c28}
#ctl svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bPlay svg{fill:currentColor}
#tl{position:relative;flex:1;height:36px;display:flex;align-items:center;margin-left:4px}
#slider{-webkit-appearance:none;appearance:none;width:100%;height:36px;margin:0;background:transparent;cursor:pointer;touch-action:none}
#slider::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
#slider::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:var(--fg);border:2px solid var(--gold)}
#slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:2px solid var(--gold)}
#ticks{position:absolute;left:10px;right:10px;top:50%;height:10px;margin-top:-5px;pointer-events:none}
#ticks b{position:absolute;top:0;width:2px;height:10px;margin-left:-1px;background:var(--dim);border-radius:1px}
body.still #poster{display:block}
body.still #stage canvas,body.still #labels,body.still #dock #ctl,body.still #caphead{display:none}
body.still #capText::before{content:'NC加工から組立までの流れ（静止画）'}
body.posterize #dock,body.posterize #tag,body.posterize #labels{display:none}
@media (min-width:600px){#stepName{font-size:15.5px}#capText{font-size:13.5px}#dock{padding:12px 16px}}
</style>
</head>
<body>
<div id="stage">
  <img id="poster" data-src="../img/x3d_nc.jpg" alt="">
  <div id="labels"></div>
  <div id="tag"><b>イメージ</b>汎用のキャビネット（実際の案件ではありません）</div>
</div>
<div id="dock">
  <div id="caphead"><span id="stepNo">1 / 6</span><span id="stepName"></span><span id="meta"></span></div>
  <p id="capText"></p>
  <div id="ctl">
    <button id="bPrev" aria-label="前の工程"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M18 6l-9 6 9 6z"/></svg></button>
    <button id="bPlay" class="primary" aria-label="一時停止"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14M16 5v14"/></svg></button>
    <button id="bNext" aria-label="次の工程"><svg viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M6 6l9 6-9 6z"/></svg></button>
    <div id="tl"><input id="slider" type="range" min="0" max="57" step="0.01" value="0" aria-label="タイムライン"><div id="ticks"></div></div>
  </div>
</div>
<script src="nc.js?v=30b815ea"></script>
</body>
</html>
